<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanilla Calculator</title>
</head>

<body>
    <canvas style="position: fixed; top: 0; left: 0; z-index: -1;"></canvas>

    <div style="width: 95vw; height: 95vh; display: flex; justify-content: center; align-items: center; margin: auto">

        <div
            style="width: fit-content; padding: 1.2rem; background-color: rgba(0, 0, 0, 80%); border-radius: 5px; border: 8px solid purple; display: flex; flex-direction: column; gap: 1rem;">

            <div
                style="display:flex; width: 98%; height: 5rem; background-color: inherit; margin: auto; align-items: center; text-align: end; font-family: monospace; font-size: 3rem; border-radius: 0.5rem; border: 4px dashed cyan; font-weight: 1000; padding-right: 0.5rem;">
                <span id="result" style="margin-left:auto; color:white;">00.0</span>
            </div>

            <div style="display: flex; flex-direction: columns; margin-top: 1rem;">
                <div
                    style="display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-flow: row; gap: 0.5rem; width: 100%;">
                    <span onclick="limpiarPantalla()"
                        style="width: 1.4rem; height: 1rem; padding: 1rem; background-color: transparent; color: #FF8C00; flex-basis: 25%; text-align: center; display:block; margin:auto; cursor: pointer; border-radius: 0.3rem; border: 2px dashed #FF8C00;">Clr</span>

                    <span onclick="agregarAPantalla('(')"
                        style="width: 1rem; height: 1rem; padding: 1rem; border-radius: 0.3rem; background-color: transparent; color: #FF8C00; flex-basis: 25%; text-align: center; cursor: pointer; border: 2px dashed #FF8C00;">(</span>
                    <span onclick="agregarAPantalla(')')"
                        style="width: 1rem; height: 1rem; padding: 1rem; border-radius: 0.3rem; background-color: transparent; color: #FF8C00; flex-basis: 25%; text-align: center; cursor: pointer; border: 2px dashed #FF8C00;">)</span>
                    <span onclick="agregarAPantalla('/')"
                        style="width: 1rem; height: 1rem; padding: 1rem; border-radius: 0.3rem; background-color: transparent; color: #32CD32; flex-basis: 25%; text-align: center; cursor: pointer; border: 2px dashed #32CD32;">/</span>
                    <span onclick="agregarAPantalla('7')"
                        style="width: 1rem; height: 1rem; padding: 1rem; border-radius: 0.3rem; background-color: transparent; color: white; border: 2px dashed white; flex-basis: 25%; text-align: center; cursor: pointer;">7</span>
                    <span onclick="agregarAPantalla('8')"
                        style="width: 1rem; height: 1rem; padding: 1rem; border-radius: 0.3rem; background-color: transparent; color: white; border: 2px dashed white; flex-basis: 25%; text-align: center; cursor: pointer;">8</span>
                    <span onclick="agregarAPantalla('9')"
                        style="width: 1rem; height: 1rem; padding: 1rem; border-radius: 0.3rem; background-color: transparent; color: white; border: 2px dashed white; flex-basis: 25%; text-align: center; cursor: pointer;">9</span>
                    <span onclick="agregarAPantalla('*')"
                        style="width: 1rem; height: 1rem; padding: 1rem; border-radius: 0.3rem; background-color: transparent; color: #32CD32; flex-basis: 25%; text-align: center; cursor: pointer; border: 2px dashed #32CD32;">*</span>
                    <span onclick="agregarAPantalla('4')"
                        style="width: 1rem; height: 1rem; padding: 1rem; border-radius: 0.3rem; background-color: transparent; color: white; border: 2px dashed white; flex-basis: 25%; text-align: center; cursor: pointer;">4</span>
                    <span onclick="agregarAPantalla('5')"
                        style="width: 1rem; height: 1rem; padding: 1rem; border-radius: 0.3rem; background-color: transparent; color: white; border: 2px dashed white; flex-basis: 25%; text-align: center; cursor: pointer;">5</span>
                    <span onclick="agregarAPantalla('6')"
                        style="width: 1rem; height: 1rem; padding: 1rem; border-radius: 0.3rem; background-color: transparent; color: white; border: 2px dashed white; flex-basis: 25%; text-align: center; cursor: pointer;">6</span>
                    <span onclick="agregarAPantalla('-')"
                        style="width: 1rem; height: 1rem; padding: 1rem; border-radius: 0.3rem; background-color: transparent; color: #32CD32; flex-basis: 25%; text-align: center; cursor: pointer; border: 2px dashed #32CD32;">-</span>
                    <span onclick="agregarAPantalla('1')"
                        style="width: 1rem; height: 1rem; padding: 1rem; border-radius: 0.3rem; background-color: transparent; color: white; border: 2px dashed white; flex-basis: 25%; text-align: center; cursor: pointer;">1</span>
                    <span onclick="agregarAPantalla('2')"
                        style="width: 1rem; height: 1rem; padding: 1rem; border-radius: 0.3rem; background-color: transparent; color: white; border: 2px dashed white; flex-basis: 25%; text-align: center; cursor: pointer;">2</span>
                    <span onclick="agregarAPantalla('3')"
                        style="width: 1rem; height: 1rem; padding: 1rem; border-radius: 0.3rem; background-color: transparent; color: white; border: 2px dashed white; flex-basis: 25%; text-align: center; cursor: pointer;">3</span>
                    <span onclick="agregarAPantalla('+')"
                        style="width: 1rem; height: 1rem; padding: 1rem; border-radius: 0.3rem; background-color: transparent; color: #32CD32; flex-basis: 25%; text-align: center; cursor: pointer; border: 2px dashed #32CD32;">+</span>
                    <span onclick="borrarUltimo()"
                        style="width: 1rem; height: 1rem; padding: 1rem; border-radius: 0.3rem; background-color: transparent; color: #FF8C00; flex-basis: 25%; text-align: center; cursor: pointer; border: 2px dashed #FF8C00;">⌫</span>
                    <span onclick="agregarAPantalla('0')"
                        style="width: 1rem; height: 1rem; padding: 1rem; border-radius: 0.3rem; background-color: transparent; color: white; border: 2px dashed white; flex-basis: 25%; text-align: center; cursor: pointer;">0</span>
                    <span onclick="agregarAPantalla('.')"
                        style="width: 1rem; height: 1rem; padding: 1rem; border-radius: 0.3rem; background-color: transparent; color: #FF8C00; flex-basis: 25%; text-align: center; cursor: pointer; border: 2px dashed #FF8C00;">.</span>
                    <span onclick="calcular()"
                        style="width: 1rem; height: 1rem; padding: 1rem; border-radius: 0.3rem; background-color: transparent; color: #32CD32; flex-basis: 25%; text-align: center; cursor: pointer; border: 2px dashed #32CD32;">=</span>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cmatrix"></script>
</body>

</html>
