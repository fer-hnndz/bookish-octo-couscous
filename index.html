<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanilla Calculator</title>
</head>

<body>

    <div
        style="width: fit-content; margin: auto; padding: 0.5rem; border: 1px solid black; border-radius: 0.5rem; background-color: lightgray;">

        <div
            style="display:flex; width: 98%; height: 5rem; background-color: azure; margin: auto; align-items: center; text-align: end; font-family: monospace; font-size: 3rem; border-radius: 0.5rem; border: 1px solid black;">
            <span id="result" style="margin-left:auto">00.0</span>
        </div>

        <div style="display: flex; flex-direction: columns; margin-top: 1rem;">
            <div
                style="display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-flow: row; gap: 0.5rem; width: 100%;">
                <span onclick="limpiarPantalla()"
                    style="width: 1rem; height: 1rem; padding: 1rem; border-radius: 99999px; background-color: black; color:white; flex-basis: 25%; text-align: center; cursor: pointer;">Clr</span>
                <span onclick="agregarAPantalla('(')"
                    style="width: 1rem; height: 1rem; padding: 1rem; border-radius: 99999px; background-color: black; color:white; flex-basis: 25%; text-align: center; cursor: pointer;">(</span>
                <span onclick="agregarAPantalla(')')"
                    style="width: 1rem; height: 1rem; padding: 1rem; border-radius: 99999px; background-color: black; color:white; flex-basis: 25%; text-align: center; cursor: pointer;">)</span>
                <span onclick="agregarAPantalla('/')"
                    style="width: 1rem; height: 1rem; padding: 1rem; border-radius: 99999px; background-color: black; color:white; flex-basis: 25%; text-align: center; cursor: pointer;">/</span>
                <span onclick="agregarAPantalla('7')"
                    style="width: 1rem; height: 1rem; padding: 1rem; border-radius: 99999px; background-color: black; color:white; flex-basis: 25%; text-align: center; cursor: pointer;">7</span>
                <span onclick="agregarAPantalla('8')"
                    style="width: 1rem; height: 1rem; padding: 1rem; border-radius: 99999px; background-color: black; color:white; flex-basis: 25%; text-align: center; cursor: pointer;">8</span>
                <span onclick="agregarAPantalla('9')"
                    style="width: 1rem; height: 1rem; padding: 1rem; border-radius: 99999px; background-color: black; color:white; flex-basis: 25%; text-align: center; cursor: pointer;">9</span>
                <span onclick="agregarAPantalla('*')"
                    style="width: 1rem; height: 1rem; padding: 1rem; border-radius: 99999px; background-color: black; color:white; flex-basis: 25%; text-align: center; cursor: pointer;">*</span>
                <span onclick="agregarAPantalla('4')"
                    style="width: 1rem; height: 1rem; padding: 1rem; border-radius: 99999px; background-color: black; color:white; flex-basis: 25%; text-align: center; cursor: pointer;">4</span>
                <span onclick="agregarAPantalla('5')"
                    style="width: 1rem; height: 1rem; padding: 1rem; border-radius: 99999px; background-color: black; color:white; flex-basis: 25%; text-align: center; cursor: pointer;">5</span>
                <span onclick="agregarAPantalla('6')"
                    style="width: 1rem; height: 1rem; padding: 1rem; border-radius: 99999px; background-color: black; color:white; flex-basis: 25%; text-align: center; cursor: pointer;">6</span>
                <span onclick="agregarAPantalla('-')"
                    style="width: 1rem; height: 1rem; padding: 1rem; border-radius: 99999px; background-color: black; color:white; flex-basis: 25%; text-align: center; cursor: pointer;">-</span>
                <span onclick="agregarAPantalla('1')"
                    style="width: 1rem; height: 1rem; padding: 1rem; border-radius: 99999px; background-color: black; color:white; flex-basis: 25%; text-align: center; cursor: pointer;">1</span>
                <span onclick="agregarAPantalla('2')"
                    style="width: 1rem; height: 1rem; padding: 1rem; border-radius: 99999px; background-color: black; color:white; flex-basis: 25%; text-align: center; cursor: pointer;">2</span>
                <span onclick="agregarAPantalla('3')"
                    style="width: 1rem; height: 1rem; padding: 1rem; border-radius: 99999px; background-color: black; color:white; flex-basis: 25%; text-align: center; cursor: pointer;">3</span>
                <span onclick="agregarAPantalla('+')"
                    style="width: 1rem; height: 1rem; padding: 1rem; border-radius: 99999px; background-color: black; color:white; flex-basis: 25%; text-align: center; cursor: pointer;">+</span>
                <span onclick="borrarUltimo()"
                    style="width: 1rem; height: 1rem; padding: 1rem; border-radius: 99999px; background-color: black; color:white; flex-basis: 25%; text-align: center; cursor: pointer;">⌫</span>
                <span onclick="agregarAPantalla('0')"
                    style="width: 1rem; height: 1rem; padding: 1rem; border-radius: 99999px; background-color: black; color:white; flex-basis: 25%; text-align: center; cursor: pointer;">0</span>
                <span onclick="agregarAPantalla('.')"
                    style="width: 1rem; height: 1rem; padding: 1rem; border-radius: 99999px; background-color: black; color:white; flex-basis: 25%; text-align: center; cursor: pointer;">.</span>
                <span onclick="calcular()"
                    style="width: 1rem; height: 1rem; padding: 1rem; border-radius: 99999px; background-color: black; color:white; flex-basis: 25%; text-align: center; cursor: pointer;">=</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>

</body>

</html>
